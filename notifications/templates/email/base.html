<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
</head>
{#
  Email clients strip <style> blocks and ignore external stylesheets, so every
  rule that matters is inline. The dark surface is the brand's #0B0F14 with the
  card one step lighter; the accent is #00A8FF. A client that force-inverts
  colours will still render the text legibly because the copy is set in a light
  neutral rather than pure white on pure black.
#}
<body style="margin:0;padding:0;background:#0B0F14;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;color:#0B0F14;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {% block preheader %}{{ brand_name }}{% endblock %}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#0B0F14;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:560px;background:#111820;border:1px solid #1E2A36;border-radius:14px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:28px 32px 20px 32px;border-bottom:1px solid #1E2A36;">
              <a href="{{ app_url or '#' }}"
                 style="text-decoration:none;color:#F8FAFC;font-size:22px;font-weight:700;letter-spacing:-0.5px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <span style="color:#00A8FF;">3</span>rader
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.65;color:#F8FAFC;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 32px 28px 32px;border-top:1px solid #1E2A36;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7A8899;">
              <p style="margin:0 0 8px 0;">
                3rader provides market analysis and trading signals. It does not
                provide financial advice, and trading carries risk of loss. Past
                performance is not indicative of future results.
              </p>
              <p style="margin:0;">
                Questions? Write to
                <a href="mailto:{{ support_email }}" style="color:#00A8FF;text-decoration:none;">{{ support_email }}</a>.
              </p>
              <p style="margin:12px 0 0 0;color:#55606D;">
                &copy; {{ year }} {{ brand_name }}. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
